<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolve Nation — Choose Your Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Montserrat:wght@500;600&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#06121a;
    --navy-alt:#071f28;
    --navy-mid:#0e2244;
    --teal:#42B9D2;
    --teal-dark:#2A8FA8;
    --teal-light:#8ee0f2;
    --ink:#eef6f8;
    --ink-dim:#9fb9c4;

    /* width of the rounded frame; the drawing inside keeps a 1000 : 760 shape */
    --w:min(96vw, calc((100vh - 200px) * 1.316), 1240px);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100%;
    background:var(--navy-deep);
    color:var(--ink);
    font-family:'Open Sans', sans-serif;
  }

  a{ color:inherit; text-decoration:none; }

  /* ---------- PAGE ---------- */
  .page{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    isolation:isolate;
  }

  /* the photo: full-bleed, quiet, behind everything */
  .bg{
    position:absolute;
    inset:0;
    z-index:-1;
    background:
      linear-gradient(180deg, rgba(6,18,26,0.58) 0%, rgba(7,31,40,0.70) 55%, rgba(14,34,68,0.84) 100%),
      url('https://media.thechurchcoassets.com/accounts/5782/f060dbaa-9570-4e01-96f4-21a1771a8928-./Copy-of-6M7A5115-2.jpg') center/cover;
    background-color:var(--navy-alt);
  }
  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(55% 55% at 50% 52%, rgba(66,185,210,0.20), transparent 70%);
  }

  /* ---------- HEADER / FOOTER ---------- */
  .brand{
    text-align:center;
    padding:clamp(1.1rem, 3vw, 1.8rem) 1.5rem 0;
    animation:rise .9s ease backwards;
  }
  .eyebrow{
    display:block;
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:.72rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--teal);
  }
  .tagline{
    margin:.5rem 0 0;
    font-size:1rem;
    color:var(--ink-dim);
  }

  .foot{
    text-align:center;
    padding:0 1.5rem clamp(.8rem, 2vw, 1.2rem);
    font-family:'Montserrat', sans-serif;
    font-size:.66rem;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:rgba(159,185,196,0.65);
    animation:rise .9s .4s ease backwards;
  }

  /* ---------- THE FRAME + DRAWING ---------- */
  .stage{
    flex:1;
    display:grid;
    place-items:center;
    padding:.6rem 0;
  }

  .frame{
    width:var(--w);
    padding:clamp(10px, 2vw, 28px);
    border:1px solid rgba(66,185,210,0.24);
    border-radius:clamp(24px, 4.5vw, 56px);
    background:rgba(6,18,26,0.28);
    animation:fade 1s ease backwards;
  }

  .map{
    display:block;
    width:100%;
    height:auto;
    overflow:visible;
  }

  .orbit{
    fill:rgba(66,185,210,0.07);
    stroke:rgba(142,224,242,0.38);
    stroke-width:2;
  }

  /* four regions: bulging inner edges, open diagonal channels between them */
  .regions{ filter:drop-shadow(0 18px 24px rgba(0,0,0,0.5)); }

  .region{
    cursor:pointer;
    transition:transform .45s cubic-bezier(.22,1,.36,1);
    transform-origin:500px 380px;
    animation:bloom 1s cubic-bezier(.22,1,.36,1) backwards;
  }
  .r-top{    animation-delay:.5s; }
  .r-right{  animation-delay:.6s; }
  .r-bottom{ animation-delay:.7s; }
  .r-left{   animation-delay:.8s; }

  .region path{
    fill:url(#wedge);
    stroke:url(#wedge);
    stroke-width:12;               /* round joins on a same-color stroke soften the corners */
    stroke-linejoin:round;
  }
  .region:hover path,
  .region:focus-visible path{
    fill:url(#wedgeHover);
    stroke:url(#wedgeHover);
  }
  .r-top:hover,    .r-top:focus-visible{    transform:translate(0,-9px); }
  .r-bottom:hover, .r-bottom:focus-visible{ transform:translate(0, 9px); }
  .r-left:hover,   .r-left:focus-visible{   transform:translate(-9px,0); }
  .r-right:hover,  .r-right:focus-visible{  transform:translate( 9px,0); }
  .region:focus-visible{ outline:none; }

  .region text{ pointer-events:none; }
  .name{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:40px;
    letter-spacing:.04em;
    text-transform:uppercase;
    fill:#fff;
  }
  .desc{
    font-family:'Open Sans', sans-serif;
    font-weight:400;
    font-size:17px;
    fill:rgba(238,246,248,0.84);
  }

  /* GIVE */
  .give{
    cursor:pointer;
    transform-origin:500px 380px;
    transition:transform .4s cubic-bezier(.22,1,.36,1);
    animation:pop .8s 1.1s cubic-bezier(.22,1,.36,1) backwards;
  }
  .give:hover, .give:focus-visible{ transform:scale(1.06); outline:none; }
  .give .disc{ fill:url(#giveFill); }
  .give .halo1{ fill:none; stroke:rgba(66,185,210,0.20); stroke-width:10; }
  .give .halo2{ fill:none; stroke:rgba(66,185,210,0.09); stroke-width:10; }
  .give .ping{
    fill:none;
    stroke:rgba(142,224,242,0.75);
    stroke-width:2;
    transform-origin:500px 380px;
    animation:ping 2.8s 2.2s ease-out infinite;
  }
  .give .word{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size:86px;
    letter-spacing:.12em;
    fill:#05212c;
  }
  .give:focus-visible .disc{ stroke:#fff; stroke-width:4; }

  /* ---------- MOTION ---------- */
  @keyframes bloom{ from{ transform:scale(.82); opacity:0; } }
  @keyframes pop{ from{ transform:scale(.6); opacity:0; } }
  @keyframes ping{ from{ transform:scale(1); opacity:.75; } to{ transform:scale(1.7); opacity:0; } }
  @keyframes fade{ from{ opacity:0; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(-10px); } }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; }
  }

  @media (max-width:600px){
    :root{ --w:94vw; }
    .desc{ display:none; }          /* no room for the sentences at phone size */
    .name{ font-size:46px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="bg" aria-hidden="true"></div>

  <header class="brand">
    <span class="eyebrow">Evolve Nation &middot; Milwaukee</span>
    <p class="tagline">Choose where you'd like to begin.</p>
  </header>

  <main class="stage">
    <div class="frame">
      <svg class="map" viewBox="0 0 1000 760" role="group" aria-label="Evolve Nation sections">
        <defs>
          <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1f6e86"/><stop offset=".55" stop-color="#0f4a60"/><stop offset="1" stop-color="#0a3446"/>
          </linearGradient>
          <linearGradient id="wedgeHover" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2d92b0"/><stop offset=".55" stop-color="#17708d"/><stop offset="1" stop-color="#0f5068"/>
          </linearGradient>
          <radialGradient id="giveFill" cx=".32" cy=".26" r=".9">
            <stop offset="0" stop-color="#c9f3fc"/><stop offset=".4" stop-color="#42B9D2"/><stop offset=".78" stop-color="#2A8FA8"/><stop offset="1" stop-color="#17677c"/>
          </radialGradient>
        </defs>

        <!-- the big circle that holds everything -->
        <ellipse class="orbit" cx="500" cy="380" rx="486" ry="366"/>

        <g class="regions">

          <!-- TOP -->
          <a class="region r-top" href="https://www.evolvenation.org/sunday-worship" aria-label="Sunday Worship Experience">
            <path d="M189.2 117.5 A470 350 0 0 1 810.8 117.5 L722.8 183.5 C640 256 360 256 277.2 183.5 Z"/>
            <text class="name" x="500" y="96" text-anchor="middle">Sunday Worship</text>
            <text class="name" x="500" y="140" text-anchor="middle">Experience</text>
            <text class="desc" x="500" y="178" text-anchor="middle">Gather on Sundays for worship,</text>
            <text class="desc" x="500" y="200" text-anchor="middle">teaching and a place to belong.</text>
          </a>

          <!-- RIGHT -->
          <a class="region r-right" href="https://www.evolvecommunitymke.org/" aria-label="Community">
            <path d="M852.5 148.5 A470 350 0 0 1 852.5 611.5 L764.5 545.5 C612 470 612 290 764.5 214.5 Z"/>
            <text class="name" x="810" y="362" text-anchor="middle">Community</text>
            <text class="desc" x="810" y="402" text-anchor="middle">Life groups, events and</text>
            <text class="desc" x="810" y="424" text-anchor="middle">a place to belong.</text>
          </a>

          <!-- BOTTOM -->
          <a class="region r-bottom" href="https://www.evolvenation.org/discipleship-2" aria-label="Discipleship">
            <path d="M810.8 642.5 A470 350 0 0 1 189.2 642.5 L277.2 576.5 C360 504 640 504 722.8 576.5 Z"/>
            <text class="name" x="500" y="608" text-anchor="middle">Discipleship</text>
            <text class="desc" x="500" y="648" text-anchor="middle">Grow in your faith,</text>
            <text class="desc" x="500" y="670" text-anchor="middle">one step at a time.</text>
          </a>

          <!-- LEFT -->
          <a class="region r-left" href="https://www.evolvenation.org/evolve-outreach" aria-label="Evolve Outreach">
            <path d="M147.5 611.5 A470 350 0 0 1 147.5 148.5 L235.5 214.5 C388 290 388 470 235.5 545.5 Z"/>
            <text class="name" x="190" y="340" text-anchor="middle">Evolve</text>
            <text class="name" x="190" y="384" text-anchor="middle">Outreach</text>
            <text class="desc" x="190" y="422" text-anchor="middle">Serving our city and</text>
            <text class="desc" x="190" y="444" text-anchor="middle">meeting real needs.</text>
          </a>

        </g>

        <!-- GIVE, in the open center -->
        <a class="give" href="https://pushpay.com/g/evolvenation?fnd=5AdLKlwoRKROWeb1iQq-AQ&amp;r=No&amp;lang=en&amp;src=qrcode" target="_top" aria-label="Give online">
          <circle class="halo2" cx="500" cy="380" r="138"/>
          <circle class="halo1" cx="500" cy="380" r="124"/>
          <circle class="ping"  cx="500" cy="380" r="112"/>
          <circle class="disc"  cx="500" cy="380" r="112"/>
          <text class="word" x="500" y="410" text-anchor="middle">GIVE</text>
        </a>
      </svg>
    </div>
  </main>

  <footer class="foot">evolvenation.org</footer>
</div>

</body>
</html>
